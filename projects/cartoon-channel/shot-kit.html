const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bn = n => String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);

function copyText(btn, text){
  const ok = () => { btn.textContent = 'Copied ✓'; btn.classList.add('ok'); setTimeout(()=>{btn.textContent='Copy prompt';btn.classList.remove('ok')},1600); };
  const fallback = () => { const pre = btn.closest('.shot,.box').querySelector('pre'); const d = btn.closest('.shot,.box').querySelector('details'); if (d) d.open = true; const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = 'Selected: copy it'; };
  try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
}

function tabs(cur){
  const items = [['start','শুরু করুন','']].concat(DATA.episodes.map(e => ['ep'+e.num, 'EP'+String(e.num).padStart(2,'0'), e.shots.filter(s=>done[s.id]).length+'/7']));
  document.getElementById('tabs').innerHTML = items.map(([id,label,n]) =>
    `<a href="#${id}" ${id===cur?'aria-current="page"':''}>${label}${n?`<span class="n">${n}</span>`:''}</a>`).join('');
}

  </div>
  ${e.shots.map(s=>`<article class="shot ${done[s.id]?'done':''}" data-id="${s.id}">
    <div class="top"><span class="sid">${s.id}</span><span class="beat">${esc(s.beat)}</span><span class="edit">edit ${esc(s.edit)}</span></div>
    <p class="see">${esc(s.see)}</p>
    <div class="ingr"><b>Ingredients:</b>${s.chars.map(c=>`<span class="ing">${charFile[c]}</span>`).join('')}${s.loc?`<span class="ing">${s.loc}</span>`:''}</div>
    <details><summary>পুরো prompt দেখুন</summary><pre>${esc(s.prompt)}</pre></details>
    <div class="actions"><button class="copy" data-shot="${s.id}">Copy prompt</button>
      <button class="mark" data-mark="${s.id}" aria-pressed="${!!done[s.id]}">${done[s.id]?'Done ✓':'Done'}</button></div>
  </article>`).join('')}
  <div class="cols">
   <div class="box"><h3>Sound effects (Premiere)</h3><ul>${e.sfx.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
   <div class="box"><h3>Upload</h3>
     <p><b>Title:</b> ${esc(e.title)}</p>
     <p><b>Description-এর প্রথম লাইন:</b> ${esc(e.descline)}</p>
     <p><b>Hashtags:</b> ${esc(e.hashtags)}</p>
     <p class="plabel">বাকি description channel-kit-এর template থেকে নেবেন।</p></div>
  </div>
  </section>`;
}

function render(){
  const h = location.hash.slice(1);
  const m = /^ep([1-7])$/.exec(h);
  const cur = m ? h : 'start';
  tabs(cur);
  document.getElementById('view').innerHTML = m ? epView(DATA.episodes[+m[1]-1]) : startView();
}
document.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.shot) { const s = DATA.episodes.flatMap(e=>e.shots).find(s=>s.id===b.dataset.shot); copyText(b, s.prompt); }
  else if (b.dataset.plate) { copyText(b, DATA.plates.find(p=>p.file===b.dataset.plate).prompt); }
  else if (b.dataset.mark) { const id = b.dataset.mark; if (done[id]) delete done[id]; else done[id] = 1; save(); const y = scrollY; render(); scrollTo(0, y); }
});
addEventListener('hashchange', () => { render(); scrollTo(0,0); });
render();
</script>

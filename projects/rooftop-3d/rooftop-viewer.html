:root { --bg:#eef0ee; --panel:#ffffff; --fg:#1d2321; --muted:#5f6b66; --line:#d5dbd8; --accent:#2f7d6d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#151918; --panel:#1f2523; --fg:#eef2f0; --muted:#9aa7a2; --line:#34403c; --accent:#5cc2ab; color-scheme:dark; } }
:root[data-theme="dark"] { --bg:#151918; --panel:#1f2523; --fg:#eef2f0; --muted:#9aa7a2; --line:#34403c; --accent:#5cc2ab; color-scheme:dark; }
html, body { height:100%; }
body { background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; display:flex; flex-direction:column; }
header { padding-block:10px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); display:flex; flex-wrap:wrap; gap:8px 16px; align-items:baseline; justify-content:space-between; border-bottom:1px solid var(--line); }
h1 { margin:0; font-size:18px; }
.sub { font-size:12px; color:var(--muted); }
#view { flex:1; min-height:320px; position:relative; }
#view canvas { display:block; width:100%; height:100%; touch-action:none; }
.bar { display:flex; gap:6px; flex-wrap:wrap; padding-block:8px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); border-top:1px solid var(--line); }
.bar button { min-height:38px; padding:0 12px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--fg); font:inherit; font-size:13px; cursor:pointer; }
.bar button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.legend { font-size:12px; color:var(--muted); align-self:center; }
#msg { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); font-size:14px; }
</style>
